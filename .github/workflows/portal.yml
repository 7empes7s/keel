name: Portal

on:
  pull_request:
    paths:
      - "portal/**"
      - "engine/**"
      - "cli/**"
      - "tools/**"
      - ".github/workflows/portal.yml"
  # Every push to master runs, with no path filter: the live auto-deploy deploys a commit
  # only when this workflow succeeded on that exact commit, so a docs-only commit on top of
  # a code change must still get a run.
  push:
    branches: [master]

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: Typecheck, build and UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            engine/package-lock.json
      - name: Install engine dependencies
        run: npm ci
        working-directory: engine
      - name: Install portal dependencies
        run: npm ci
        working-directory: portal
      - name: Typecheck
        run: npm run typecheck
        working-directory: portal
      - name: Production build
        run: npm run build
        working-directory: portal
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: portal
      - name: Accessibility, screenshot and interaction checks
        run: npm run test:ui
        working-directory: portal
        env:
          CI: "true"
      - name: Upload UI report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-report
          path: |
            portal/ui-harness/playwright-report
            portal/ui-harness/test-results
          retention-days: 14

  tests:
    name: Portal tests (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keel
          POSTGRES_DB: keel_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KEEL_DB_TEST_URL: postgres://keel@localhost:5432/keel_test
      KEEL_TENANT_CONFIG_PATH: ${{ github.workspace }}/ci-tenant.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            engine/package-lock.json
      - name: Prepare database and tenant config
        # Test files run in parallel and each applies the schema; creating the
        # extension once up front avoids a race on CREATE EXTENSION.
        run: |
          psql "$KEEL_DB_TEST_URL" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"
          echo '{"tenantId":"00000000-0000-0000-0000-0000000000c1"}' > "$KEEL_TENANT_CONFIG_PATH"
      - name: Install engine dependencies
        run: npm ci
        working-directory: engine
      - name: Install portal dependencies
        run: npm ci
        working-directory: portal
      - name: Run portal tests
        run: npm test
        working-directory: portal
      - name: Run restore engine tests
        # The restore path's boundary suites (roadmap task Validate set). Serial:
        # several suites share the one test database.
        run: >-
          node --test --test-concurrency=1
          roadmap/relationship-restore.test.mjs roadmap/fidelity-ledger.test.mjs
          roadmap/native-recovery.test.mjs roadmap/identity-completion.test.mjs
          roadmap/content-effects.test.mjs roadmap/compensation.test.mjs
          roadmap/incident-recovery.test.mjs roadmap/portal-experience.test.mjs
          roadmap/named-objects.test.mjs roadmap/protect-page.test.mjs
          roadmap/coverage-ui.test.mjs roadmap/baseline-compliance-ui.test.mjs
          roadmap/ownership.test.mjs roadmap/drill-harness.test.mjs
          roadmap/alert-state.test.mjs
          roadmap/alert-escalation.test.mjs
          restore/*.test.mjs reconcile/*.test.mjs
          safety/*.test.mjs policy/*.test.mjs ../cli/keel-restore.test.mjs
          ../cli/keel-remediate.test.mjs ../cli/keel-worker.test.mjs
        working-directory: engine
