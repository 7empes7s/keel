name: Portal

on:
  pull_request:
    paths:
      - "portal/**"
      - "engine/**"
      - "cli/**"
      - "tools/**"
      # The container scripts and Dockerfiles: engine tests read them, and CI resolves pinned base images.
      - "ops/powershell/**"
      - ".github/workflows/portal.yml"
  # Every push to master runs, with no path filter: the live auto-deploy deploys a commit
  # only when this workflow succeeded on that exact commit, so a docs-only commit on top of
  # a code change must still get a run.
  push:
    branches: [master]
  # A merge made with GITHUB_TOKEN does not trigger the push run above, so the merge gate
  # dispatches this workflow on master after merging; the auto-deploy then sees a
  # successful run on the merge commit.
  workflow_dispatch:

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: Typecheck, build and UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            engine/package-lock.json
      - name: Pinned base images exist
        # A FROM pinned to a digest the registry does not have only failed on the server's
        # build (#662). Resolve every pinned FROM here, without pulling the image.
        run: |
          for file in ops/powershell/Dockerfile*; do
            ref="$(awk '/^FROM /{ print $2; exit }' "$file")"
            echo "$file: $ref"
            docker buildx imagetools inspect "$ref" > /dev/null
          done
      - name: Install engine dependencies
        run: npm ci
        working-directory: engine
      - name: Install portal dependencies
        run: npm ci
        working-directory: portal
      - name: Typecheck
        run: npm run typecheck
        working-directory: portal
      - name: Production build
        run: npm run build
        working-directory: portal
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: portal
      - name: Accessibility, screenshot and interaction checks
        run: npm run test:ui
        working-directory: portal
        env:
          CI: "true"
      - name: Upload UI report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-report
          path: |
            portal/ui-harness/playwright-report
            portal/ui-harness/test-results
          retention-days: 14

  tests:
    name: Portal tests (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keel
          POSTGRES_DB: keel_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KEEL_DB_TEST_URL: postgres://keel@localhost:5432/keel_test
      KEEL_TENANT_CONFIG_PATH: ${{ github.workspace }}/ci-tenant.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            engine/package-lock.json
      - name: Install age
        # The offsite tests encrypt and decrypt dumps with the age CLI, as the deploy host does.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Prepare database and tenant config
        # Test files run in parallel and each applies the schema; creating the
        # extension once up front avoids a race on CREATE EXTENSION.
        run: |
          psql "$KEEL_DB_TEST_URL" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"
          echo '{"tenantId":"00000000-0000-0000-0000-0000000000c1"}' > "$KEEL_TENANT_CONFIG_PATH"
      - name: Install engine dependencies
        run: npm ci
        working-directory: engine
      - name: Install portal dependencies
        run: npm ci
        working-directory: portal
      - name: Run portal tests
        run: npm test
        working-directory: portal
      - name: Run restore engine tests
        # Every tracked *.test.mjs under engine/, cli/ and tools/, found by
        # tools/engine-test-files.sh (glob discovery: adding a test needs no edit here;
        # the few host-only suites are excluded there with a reason). Four files at a time:
        # each database suite works in its own schema (engine/test/dbTestHelper.mjs) and the
        # extension is created up front. Most of a serial run's ~6 minutes is read-after-write
        # retry sleeps, which overlap this way (about 2 minutes).
        run: |
          list="$(../tools/engine-test-files.sh)"
          mapfile -t files <<< "$list"
          echo "Running ${#files[@]} test files"
          node --test --test-concurrency=4 "${files[@]}"
        working-directory: engine
