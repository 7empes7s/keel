# Drop-in for caddy.service: a private directory for Caddy's admin socket.
# Install as /etc/systemd/system/caddy.service.d/keel-admin-socket.conf, then
# `systemctl daemon-reload`. The Caddyfile's global block then says
#   admin unix//run/caddy/admin.sock
# systemd creates /run/caddy (mode 0700, owned by the unit's user) on each start, so only
# Caddy and root can reach the socket, and `systemctl reload caddy` keeps working.
# See ops/README.md, "Caddy admin API".
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
