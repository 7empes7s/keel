name: Automerge label

# The `automerge` label approves the head commit it was added on, not later pushes. Every push
# to a PR removes the label, so code pushed after the review needs a new review and a new label.
# pull_request_target runs master's copy of this file with a write token, also for fork PRs.
# It never checks out or runs PR code.

on:
  pull_request_target:
    types: [synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  drop:
    name: Drop automerge label after a push
    if: contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove the label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A failed delete is fine only if the label is already gone (a second push raced this one).
          if ! gh api -X DELETE "repos/$REPO/issues/$PR/labels/automerge" >/dev/null; then
            gh api "repos/$REPO/issues/$PR/labels" -q '.[].name' | grep -qx automerge && exit 1
          fi
          echo "Removed automerge from #$PR after a push to $SHA. Add it again once this commit is reviewed."
