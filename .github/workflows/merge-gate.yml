name: Merge gate

# Merges PRs labelled `automerge` once they are safe. This repo is private on the free
# GitHub plan, so branch protection can't enforce it; this workflow is the gate instead.
# A PR merges when all of these hold:
#   - it still has the `automerge` label (automerge-label.yml removes it on every push)
#   - it is not a draft and has no merge conflict
#   - every check run on its head commit has finished, and none failed
#   - if it touches code (the Portal workflow's paths), the Portal workflow passed on its head commit
#   - no reviewer's latest verdict requests changes, and no review thread is unresolved
#   - when the repo variable REQUIRE_REVIEW is "true", someone other than the author has reviewed
#     its head commit (for example Codex)
# The merge is pinned to the head commit it checked, so a push during the check can't slip in.
# Pushes made with GITHUB_TOKEN don't start push workflows, so after a merge this dispatches
# the Portal workflow on master. The live auto-deploy needs a successful run on that commit.

on:
  workflow_run:
    workflows: [Portal]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request:
    # Not synchronize: a push removes the label (automerge-label.yml) instead.
    types: [labeled, ready_for_review]
  workflow_dispatch:

concurrency:
  group: merge-gate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  # Listing PRs by label goes through the issues API.
  issues: read

jobs:
  gate:
    name: Merge gate
    # Run only when the event can make a PR mergeable, so idle events cost no runner minutes
    # (a skipped job is free): a successful Portal run, a review or PR event on a PR labelled
    # `automerge` (for `labeled`, only that label), or a manual dispatch. A failed Portal run
    # can't unblock anything. Successful master runs still trigger it: they retry a PR that
    # was skipped as "not mergeable yet" right after an earlier merge in the same pass.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'automerge') &&
        (github.event.action != 'labeled' || github.event.label.name == 'automerge')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.pull_request.labels.*.name, 'automerge'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Always run master's copy of the script, so a PR can't change the gate that judges it.
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Merge ready PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_REVIEW: ${{ vars.REQUIRE_REVIEW }}
        run: tools/merge-gate.sh
